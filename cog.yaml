build:
  cuda: "12.1"
  gpu: true
  python_version: "3.10"

  system_packages:
    - libgl1
    - libglib2.0-0
    - git

  run:
    - pip install --find-links https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.5.1_cu121.html torch==2.5.1

    - git clone --depth 1 https://github.com/facebookresearch/sam-3d-objects.git /src/sam-3d-objects

    - bash -c '
        export PIP_EXTRA_INDEX_URL="https://pypi.ngc.nvidia.com https://download.pytorch.org/whl/cu121";
        export PIP_FIND_LINKS="https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.5.1_cu121.html";
        cd /src/sam-3d-objects;
        pip install -e ".[dev,p3d,inference]"
      '

    # 4) Apply the Hydra patch once.
    - cd /src/sam-3d-objects && python patching/hydra

predict: "predict.py:Predictor"