build:
  gpu: true
  cuda: "12.1"          # Replicate base; you’ll still install cu128 wheels
  python_version: "3.11"
  system_packages:
    - build-essential
    - cmake
    - ninja-build
    - git
    - libgl1
    - libglib2.0-0
  run:
    # 1) Install torch 2.8.0 + cu128 (like the gist)
    - python -m pip install --upgrade pip
    - python -m pip install torch==2.8.0+cu128 torchvision==0.23.0+cu128 torchaudio==2.8.0+cu128 --index-url https://download.pytorch.org/whl/cu128

    # 2) Install all the other Python deps (copy the gist’s requirements.txt into your repo)
    - python -m pip install -r requirements.txt

    # 3) Clone & pin sam-3d-objects + build pytorch3d + kaolin
    - git clone https://github.com/facebookresearch/sam-3d-objects.git /src/sam-3d-objects
    - cd /src/sam-3d-objects && git checkout 0e3d254f70c388efd10d6deae3f12a1344eb1957

    # pytorch3d V0.7.8 (from source, as in the gist)
    - git clone https://github.com/facebookresearch/pytorch3d.git /src/pytorch3d
    - cd /src/pytorch3d && git checkout V0.7.8 && python setup.py install

    # kaolin v0.18.0
    - git clone https://github.com/NVIDIAGameWorks/kaolin.git /src/kaolin
    - cd /src/kaolin && git checkout v0.18.0 && python -m pip install -e . --no-build-isolation